<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Сканер харчування</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom)
        14px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 16px;
      text-align: center;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 800;
    }

    #reader {
      display: none;
      width: 100%;
      min-height: 58vh;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 58vh !important;
      object-fit: cover !important;
    }

    .button {
      width: 100%;
      min-height: 68px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 750;
      color: white;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.55;
    }

    #issueButton {
      background: #1a73e8;
    }

    #checkButton {
      background: #5f6368;
    }

    #backButton {
      display: none;
      background: #ffffff;
      color: #333333;
      border: 2px solid #c7c7c7;
    }

    #modeTitle {
      display: none;
      margin: 14px 0 4px;
      text-align: center;
      font-size: 21px;
      font-weight: 750;
    }

    #result {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 22px 16px;
      border-radius: 16px;
      text-align: center;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 850;
      white-space: pre-line;
    }

    #result.success {
      display: block;
      background: #dff5e5;
      color: #116329;
      border: 4px solid #188038;
    }

    #result.unplanned {
      display: block;
      background: #fff3cd;
      color: #7a4b00;
      border: 4px solid #f9ab00;
    }

    #result.duplicate {
      display: block;
      background: #fff1cc;
      color: #7a4b00;
      border: 4px solid #f9ab00;
    }

    #result.check {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
      border: 4px solid #4285f4;
    }

    #result.error {
      display: block;
      background: #fde2e1;
      color: #a50e0e;
      border: 4px solid #d93025;
    }

    #result.loading {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
      border: 4px solid #4285f4;
    }

    .hint {
      margin: 15px 4px 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.35;
      color: #555;
    }

    @media (min-width: 700px) {
      #reader {
        min-height: 500px;
      }

      #reader video {
        height: 500px !important;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Сканер харчування</h1>

  <div id="modeTitle"></div>

  <div id="reader"></div>

  <button
    id="issueButton"
    class="button"
    onclick="selectMode('issue')"
  >
    Видати харчування
  </button>

  <button
    id="checkButton"
    class="button"
    onclick="selectMode('check')"
  >
    Перевірити QR-код
  </button>

  <button
    id="backButton"
    class="button"
    onclick="goBack()"
  >
    Назад
  </button>

  <div id="result"></div>

  <div class="hint" id="hint">
    Оберіть потрібну дію
  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzHzQll8jL7LlWkRIJgC9veIrBZjOR-Zb9dsrUc5_ZsUqtb2sCoTEAhTZKDQdfCKB22Tw/exec';

const SCAN_PAUSE_MS = 3000;

let scanner = null;
let processing = false;
let audioContext = null;
let currentMode = null;


// ==============================
// ВИБІР РЕЖИМУ
// ==============================

async function selectMode(mode) {

  currentMode = mode;

  document.getElementById('issueButton').style.display = 'none';
  document.getElementById('checkButton').style.display = 'none';

  document.getElementById('backButton').style.display = 'block';
  document.getElementById('reader').style.display = 'block';

  const modeTitle = document.getElementById('modeTitle');
  modeTitle.style.display = 'block';

  if (mode === 'issue') {
    modeTitle.textContent = 'Видача харчування';

    document.getElementById('hint').textContent =
      'Наведіть камеру на QR-картку учня';
  }

  if (mode === 'check') {
    modeTitle.textContent = 'Перевірка QR-коду';

    document.getElementById('hint').textContent =
      'Проскануйте картку, щоб дізнатися, кому вона належить';
  }

  hideResult();

  await startScanner();
}


// ==============================
// ЗАПУСК КАМЕРИ
// ==============================

async function startScanner() {

  try {

    if (!audioContext) {
      audioContext =
        new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    if (scanner) {
      try {
        await scanner.stop();
      } catch (e) {}

      try {
        await scanner.clear();
      } catch (e) {}
    }

    scanner = new Html5Qrcode('reader');

    await scanner.start(
      {
        facingMode: 'environment'
      },
      {
        fps: 12,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.72
            );

          return {
            width: size,
            height: size
          };
        }
      },
      onScanSuccess,
      function() {}
    );

  } catch (error) {

    showResult(
      'Не вдалося запустити камеру.\nПеревірте дозвіл Safari.',
      'error'
    );

    playErrorSound();
  }
}


// ==============================
// УСПІШНЕ ЗЧИТУВАННЯ QR
// ==============================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  showResult(
    'Перевірка...',
    'loading'
  );

  const qrValue =
    decodedText.trim();

  if (currentMode === 'check') {
    sendCheck(qrValue);
  } else {
    sendIssue(qrValue);
  }
}


// ==============================
// ВИДАЧА ХАРЧУВАННЯ
// ==============================

function sendIssue(qrValue) {

  sendRequest(
    'scan',
    qrValue,
    function(response) {

      if (!response) {

        showResult(
          'Некоректна відповідь сервера.',
          'error'
        );

        playErrorSound();
        releaseScanner();

        return;
      }

      if (
        response.status === 'success' &&
        response.planned === false
      ) {

        showResult(
          response.message,
          'unplanned'
        );

        playUnplannedSound();
      }

      else if (
        response.status === 'success'
      ) {

        showResult(
          response.message,
          'success'
        );

        playSuccessSound();
      }

      else if (
        response.status === 'duplicate'
      ) {

        showResult(
          response.message,
          'duplicate'
        );

        playDuplicateSound();
      }

      else {

        showResult(
          response.message || 'QR-код недійсний.',
          'error'
        );

        playErrorSound();
      }

      releaseScanner();
    }
  );
}


// ==============================
// ПЕРЕВІРКА QR
// ==============================

function sendCheck(qrValue) {

  sendRequest(
    'check',
    qrValue,
    function(response) {

      if (!response) {

        showResult(
          'Некоректна відповідь сервера.',
          'error'
        );

        playErrorSound();
        releaseScanner();

        return;
      }

      if (
        response.status === 'check'
      ) {

        showResult(
          response.message,
          'check'
        );

        playCheckSound();
      }

      else {

        showResult(
          response.message || 'QR-код недійсний.',
          'error'
        );

        playErrorSound();
      }

      releaseScanner();
    }
  );
}


// ==============================
// JSONP ЗАПИТ ДО APPS SCRIPT
// ==============================

function sendRequest(apiMode, qrValue, onSuccess) {

  const callbackName =
    'scanCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement('script');

  const timer =
    setTimeout(function() {

      cleanup();

      showResult(
        'Немає відповіді від сервера.',
        'error'
      );

      playErrorSound();

      releaseScanner();

    }, 10000);


  window[callbackName] =
    function(response) {

      clearTimeout(timer);

      cleanup();

      onSuccess(response);
    };


  script.onerror =
    function() {

      clearTimeout(timer);

      cleanup();

      showResult(
        'Помилка зв’язку із сервером.',
        'error'
      );

      playErrorSound();

      releaseScanner();
    };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }


  script.src =
    API_URL +
    '?api=' +
    encodeURIComponent(apiMode) +
    '&qr=' +
    encodeURIComponent(qrValue) +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&_=' +
    Date.now();


  document.body.appendChild(script);
}


// ==============================
// ПОВЕРНЕННЯ НА ГОЛОВНИЙ ЕКРАН
// ==============================

async function goBack() {

  processing = false;
  currentMode = null;

  if (scanner) {

    try {
      await scanner.stop();
    } catch (e) {}

    try {
      await scanner.clear();
    } catch (e) {}

    scanner = null;
  }

  document.getElementById('reader').style.display = 'none';

  document.getElementById('issueButton').style.display = 'block';
  document.getElementById('checkButton').style.display = 'block';

  document.getElementById('backButton').style.display = 'none';

  document.getElementById('modeTitle').style.display = 'none';

  document.getElementById('hint').textContent =
    'Оберіть потрібну дію';

  hideResult();
}


// ==============================
// РОЗБЛОКУВАННЯ СКАНЕРА
// ==============================

function releaseScanner() {

  setTimeout(function() {
    processing = false;
  }, SCAN_PAUSE_MS);
}


// ==============================
// РЕЗУЛЬТАТ
// ==============================

function showResult(message, type) {

  const result =
    document.getElementById('result');

  result.style.display = 'block';
  result.className = type;
  result.textContent = message;
}

function hideResult() {

  const result =
    document.getElementById('result');

  result.className = '';

  result.textContent = '';

  result.style.display = 'none';
}


// ==============================
// ЗВУКИ
// ==============================

function playTone(
  frequency,
  duration,
  delay = 0,
  volume = 0.95
) {

  if (!audioContext) {
    return;
  }

  const start =
    audioContext.currentTime + delay;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = 'square';

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    0.0001,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(start);

  oscillator.stop(
    start + duration
  );
}


// УСПІШНА ВИДАЧА

function playSuccessSound() {

  playTone(
    1050,
    0.28,
    0,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}


// ВИДАНО ПОЗА ПЛАНОМ

function playUnplannedSound() {

  playTone(
    850,
    0.22,
    0,
    0.95
  );

  playTone(
    1150,
    0.30,
    0.28,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      150,
      100,
      200
    ]);
  }
}


// ПОВТОРНЕ СКАНУВАННЯ

function playDuplicateSound() {

  playTone(
    600,
    0.25,
    0,
    0.95
  );

  playTone(
    600,
    0.25,
    0.32,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      150,
      120,
      150
    ]);
  }
}


// ПЕРЕВІРКА QR

function playCheckSound() {

  playTone(
    900,
    0.18,
    0,
    0.85
  );

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }
}


// ПОМИЛКА

function playErrorSound() {

  playTone(
    350,
    0.25,
    0,
    0.95
  );

  playTone(
    260,
    0.25,
    0.30,
    0.95
  );

  playTone(
    180,
    0.35,
    0.60,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      200,
      100,
      200,
      100,
      250
    ]);
  }
}

</script>

</body>
</html>
