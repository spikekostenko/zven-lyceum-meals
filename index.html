<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Сканер харчування</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom)
        14px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 16px;
      text-align: center;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 800;
    }

    #reader {
      width: 100%;
      min-height: 58vh;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 58vh !important;
      object-fit: cover !important;
    }

    #startButton {
      width: 100%;
      min-height: 68px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      font-size: 23px;
      font-weight: 750;
      background: #1a73e8;
      color: white;
    }

    #startButton:disabled {
      opacity: .55;
    }

    #result {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 22px 16px;
      border-radius: 16px;
      text-align: center;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 850;
      white-space: pre-line;
    }

    #result.success {
      display: block;
      background: #dff5e5;
      color: #116329;
      border: 4px solid #188038;
    }

    #result.unplanned {
      display: block;
      background: #fff3cd;
      color: #7a4b00;
      border: 4px solid #f9ab00;
    }

    #result.duplicate {
      display: block;
      background: #fff1cc;
      color: #7a4b00;
      border: 4px solid #f9ab00;
    }

    #result.error {
      display: block;
      background: #fde2e1;
      color: #a50e0e;
      border: 4px solid #d93025;
    }

    #result.loading {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
      border: 4px solid #4285f4;
    }

    .hint {
      margin: 15px 4px 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.35;
      color: #555;
    }

    @media (min-width: 700px) {
      #reader {
        min-height: 500px;
      }

      #reader video {
        height: 500px !important;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Сканер харчування</h1>

  <div id="reader"></div>

  <button id="startButton" onclick="startScanner()">
    Увімкнути камеру
  </button>

  <div id="result"></div>

  <div class="hint">
    Наведіть камеру на QR-картку учня
  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzHzQll8jL7LlWkRIJgC9veIrBZjOR-Zb9dsrUc5_ZsUqtb2sCoTEAhTZKDQdfCKB22Tw/exec';

const SCAN_PAUSE_MS = 3000;

let scanner = null;
let processing = false;
let audioContext = null;


async function startScanner() {

  const button =
    document.getElementById('startButton');

  button.disabled = true;
  button.textContent = 'Запуск камери...';

  try {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    if (
      audioContext.state === 'suspended'
    ) {
      await audioContext.resume();
    }

    scanner =
      new Html5Qrcode('reader');

    await scanner.start(
      {
        facingMode: 'environment'
      },
      {
        fps: 12,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.72
            );

          return {
            width: size,
            height: size
          };
        }
      },

      onScanSuccess,

      function() {}
    );

    button.style.display = 'none';

  } catch (error) {

    button.disabled = false;
    button.textContent =
      'Увімкнути камеру';

    showResult(
      'Не вдалося запустити камеру. Перевірте дозвіл Safari.',
      'error'
    );

    playErrorSound();
  }
}


function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing = true;

  showResult(
    'Перевірка...',
    'loading'
  );

  sendScan(
    decodedText.trim()
  );
}


function sendScan(studentId) {

  const callbackName =
    'scanCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement('script');

  const timer =
    setTimeout(function() {

      cleanup();

      showResult(
        'Немає відповіді від сервера.',
        'error'
      );

      playErrorSound();

      releaseScanner();

    }, 10000);


  window[callbackName] =
    function(response) {

      clearTimeout(timer);

      cleanup();

      if (!response) {

        showResult(
          'Некоректна відповідь сервера.',
          'error'
        );

        playErrorSound();

        releaseScanner();

        return;
      }


      if (
        response.status === 'success' &&
        response.planned === false
      ) {

        showResult(
          response.message,
          'unplanned'
        );

        playUnplannedSound();

      } else if (
        response.status === 'success'
      ) {

        showResult(
          response.message,
          'success'
        );

        playSuccessSound();

      } else if (
        response.status === 'duplicate'
      ) {

        showResult(
          response.message,
          'duplicate'
        );

        playDuplicateSound();

      } else {

        showResult(
          response.message ||
          'QR-код недійсний.',
          'error'
        );

        playErrorSound();
      }

      releaseScanner();
    };


  script.onerror =
    function() {

      clearTimeout(timer);

      cleanup();

      showResult(
        'Помилка зв’язку із сервером.',
        'error'
      );

      playErrorSound();

      releaseScanner();
    };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }


  script.src =
    API_URL +
    '?api=scan' +
    '&studentId=' +
    encodeURIComponent(studentId) +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&_=' +
    Date.now();

  document.body.appendChild(script);
}


function releaseScanner() {

  /*
   * Протягом 3 секунд після результату
   * жоден QR не може бути зчитаний.
   */
  setTimeout(function() {

    processing = false;

  }, SCAN_PAUSE_MS);
}


function showResult(
  message,
  type
) {

  const result =
    document.getElementById('result');

  result.className = type;
  result.textContent = message;
}


/*
 * Гучні сигнали.
 * На iPhone фактична максимальна
 * гучність також залежить від
 * системної гучності пристрою.
 */

function playTone(
  frequency,
  duration,
  delay = 0,
  volume = 0.95
) {

  if (!audioContext) {
    return;
  }

  const start =
    audioContext.currentTime + delay;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = 'square';

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    0.0001,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(start);
  oscillator.stop(
    start + duration
  );
}


/*
 * УСПІШНО:
 * один чіткий високий сигнал.
 */
function playSuccessSound() {

  playTone(
    1050,
    0.28,
    0,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}


/*
 * ПОЗА ПЛАНОМ:
 * два різних сигнали.
 */
function playUnplannedSound() {

  playTone(
    850,
    0.22,
    0,
    0.95
  );

  playTone(
    1150,
    0.30,
    0.28,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(
      [150, 100, 200]
    );
  }
}


/*
 * УЖЕ ВИДАНО:
 * два однакові сигнали.
 */
function playDuplicateSound() {

  playTone(
    600,
    0.25,
    0,
    0.95
  );

  playTone(
    600,
    0.25,
    0.32,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(
      [150, 120, 150]
    );
  }
}


/*
 * ПОМИЛКА:
 * три низькі спадні сигнали.
 */
function playErrorSound() {

  playTone(
    350,
    0.25,
    0,
    0.95
  );

  playTone(
    260,
    0.25,
    0.30,
    0.95
  );

  playTone(
    180,
    0.35,
    0.60,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(
      [200, 100, 200, 100, 250]
    );
  }
}

</script>

</body>
</html>
