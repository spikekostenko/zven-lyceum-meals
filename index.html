<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Сканер харчування</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom)
        14px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 16px;
      text-align: center;
      font-size: 32px;
      line-height: 1.15;
      font-weight: 800;
    }

    /* PIN */

    #pinScreen {
      margin-top: 25px;
    }

    .pinTitle {
      text-align: center;
      font-size: 21px;
      font-weight: 750;
      margin-bottom: 14px;
    }

    #pinInput {
      width: 100%;
      height: 64px;
      border: 2px solid #c7c7c7;
      border-radius: 14px;
      background: white;
      font-size: 28px;
      font-weight: 750;
      text-align: center;
      letter-spacing: 8px;
      outline: none;
    }

    #pinInput:focus {
      border-color: #1a73e8;
    }

    #pinMessage {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      background: #fde2e1;
      color: #a50e0e;
      border: 2px solid #d93025;
    }

    /* ГОЛОВНИЙ ЕКРАН */

    #mainScreen {
      display: none;
    }

    #reader {
      display: none;
      width: 100%;
      min-height: 58vh;
      background: #111;
      border-radius: 18px;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 58vh !important;
      object-fit: cover !important;
    }

    .button {
      width: 100%;
      min-height: 68px;
      margin-top: 14px;
      border: 0;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 750;
      color: white;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.55;
    }

    #loginButton {
      background: #1a73e8;
    }

    #issueButton {
      background: #1a73e8;
    }

    #checkButton {
      background: #5f6368;
    }

    #backButton {
      display: none;
      background: #ffffff;
      color: #333333;
      border: 2px solid #c7c7c7;
    }

    #logoutButton {
      background: transparent;
      color: #5f6368;
      border: 2px solid #c7c7c7;
      min-height: 52px;
      font-size: 17px;
      margin-top: 25px;
    }

    #modeTitle {
      display: none;
      margin: 14px 0 4px;
      text-align: center;
      font-size: 21px;
      font-weight: 750;
    }

    #result {
      display: none;
      width: 100%;
      margin-top: 14px;
      padding: 22px 16px;
      border-radius: 16px;
      text-align: center;
      font-size: 27px;
      line-height: 1.25;
      font-weight: 850;
      white-space: pre-line;
    }

    /* УСПІШНО ВИДАНО */

    #result.success {
      display: block;
      background: #dff5e5;
      color: #116329;
      border: 4px solid #188038;
    }

    /* ВИДАНО ПОЗА ПЛАНОМ — ТЕЖ УСПІШНА ВИДАЧА */

    #result.unplanned {
      display: block;
      background: #dff5e5;
      color: #116329;
      border: 4px solid #188038;
    }

    /* УЖЕ ВИДАНО — ЧЕРВОНИЙ */

    #result.duplicate {
      display: block;
      background: #fde2e1;
      color: #a50e0e;
      border: 4px solid #d93025;
    }

    /* ПЕРЕВІРКА QR */

    #result.check {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
      border: 4px solid #4285f4;
    }

    /* ПОМИЛКА */

    #result.error {
      display: block;
      background: #fde2e1;
      color: #a50e0e;
      border: 4px solid #d93025;
    }

    #result.loading {
      display: block;
      background: #e8f0fe;
      color: #174ea6;
      border: 4px solid #4285f4;
    }

    .hint {
      margin: 15px 4px 0;
      text-align: center;
      font-size: 18px;
      line-height: 1.35;
      color: #555;
    }

    @media (min-width: 700px) {
      #reader {
        min-height: 500px;
      }

      #reader video {
        height: 500px !important;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Сканер харчування</h1>

  <!-- PIN -->

  <div id="pinScreen">

    <div class="pinTitle">
      Введіть PIN-код
    </div>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      autocomplete="off"
      maxlength="6"
      placeholder="••••••"
    >

    <button
      id="loginButton"
      class="button"
      onclick="login()"
    >
      Увійти
    </button>

    <div id="pinMessage">
      Невірний PIN
    </div>

  </div>

  <!-- ОСНОВНИЙ ЕКРАН -->

  <div id="mainScreen">

    <div id="modeTitle"></div>

    <div id="reader"></div>

    <button
      id="issueButton"
      class="button"
      onclick="selectMode('issue')"
    >
      Видати харчування
    </button>

    <button
      id="checkButton"
      class="button"
      onclick="selectMode('check')"
    >
      Перевірити QR-код
    </button>

    <button
      id="backButton"
      class="button"
      onclick="goBack()"
    >
      Назад
    </button>

    <div id="result"></div>

    <div class="hint" id="hint">
      Оберіть потрібну дію
    </div>

    <button
      id="logoutButton"
      class="button"
      onclick="logout()"
    >
      Забути PIN на цьому пристрої
    </button>

  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzHzQll8jL7LlWkRIJgC9veIrBZjOR-Zb9dsrUc5_ZsUqtb2sCoTEAhTZKDQdfCKB22Tw/exec';

const NEXT_SCAN_DELAY_MS = 500;
const SAME_QR_BLOCK_MS = 5000;
const SLOW_RESPONSE_NOTICE_MS = 7000;
const REQUEST_TIMEOUT_MS = 60000;

let scanner = null;
let processing = false;
let audioContext = null;
let currentMode = null;
let scannerPin = '';
let lastQrValue = '';
let lastQrAt = 0;


// ==============================
// ЗАПУСК СТОРІНКИ
// ==============================

window.addEventListener('load', function() {

  const savedPin =
    localStorage.getItem('zvenScannerPin');

  if (savedPin) {
    scannerPin = savedPin;
    showMainScreen();
  }
});


// ==============================
// PIN
// ==============================

function login() {

  const pin =
    document.getElementById('pinInput').value.trim();

  if (!/^\d{6}$/.test(pin)) {

    showPinError(
      'Введіть 6-значний PIN'
    );

    return;
  }

  scannerPin = pin;

  localStorage.setItem(
    'zvenScannerPin',
    pin
  );

  document.getElementById('pinMessage').style.display =
    'none';

  showMainScreen();
}


function showPinError(message) {

  const box =
    document.getElementById('pinMessage');

  box.textContent = message;
  box.style.display = 'block';
}


function showMainScreen() {

  document.getElementById('pinScreen').style.display =
    'none';

  document.getElementById('mainScreen').style.display =
    'block';
}


async function logout() {

  await stopScanner();

  localStorage.removeItem(
    'zvenScannerPin'
  );

  scannerPin = '';
  currentMode = null;
  processing = false;
  lastQrValue = '';
  lastQrAt = 0;

  document.getElementById('mainScreen').style.display =
    'none';

  document.getElementById('pinScreen').style.display =
    'block';

  document.getElementById('pinInput').value =
    '';

  document.getElementById('pinMessage').style.display =
    'none';

  resetMainScreen();
}


// ==============================
// ВИБІР РЕЖИМУ
// ==============================

async function selectMode(mode) {

  currentMode = mode;

  document.getElementById('issueButton').style.display =
    'none';

  document.getElementById('checkButton').style.display =
    'none';

  document.getElementById('logoutButton').style.display =
    'none';

  document.getElementById('backButton').style.display =
    'block';

  document.getElementById('reader').style.display =
    'block';

  const modeTitle =
    document.getElementById('modeTitle');

  modeTitle.style.display =
    'block';

  if (mode === 'issue') {

    modeTitle.textContent =
      'Видача харчування';

    document.getElementById('hint').textContent =
      'Наведіть камеру на QR-картку учня';
  }

  if (mode === 'check') {

    modeTitle.textContent =
      'Перевірка QR-коду';

    document.getElementById('hint').textContent =
      'Проскануйте картку, щоб дізнатися, кому вона належить';
  }

  hideResult();

  await startScanner();
}


// ==============================
// КАМЕРА
// ==============================

async function startScanner() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
    }

    if (audioContext.state === 'suspended') {
      await audioContext.resume();
    }

    await stopScanner();

    scanner =
      new Html5Qrcode('reader');

    await scanner.start(
      {
        facingMode: 'environment'
      },
      {
        fps: 12,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.72
            );

          return {
            width: size,
            height: size
          };
        }
      },
      onScanSuccess,
      function() {}
    );

  } catch (error) {

    showResult(
      'Не вдалося запустити камеру.\nПеревірте дозвіл Safari.',
      'error'
    );

    playErrorSound();
  }
}


async function stopScanner() {

  if (!scanner) {
    return;
  }

  try {
    await scanner.stop();
  } catch (e) {}

  try {
    await scanner.clear();
  } catch (e) {}

  scanner = null;
}


// ==============================
// СКАНУВАННЯ
// ==============================

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  const qrValue =
    decodedText.trim();

  const now = Date.now();

  if (
    qrValue === lastQrValue &&
    now - lastQrAt < SAME_QR_BLOCK_MS
  ) {
    return;
  }

  lastQrValue = qrValue;
  lastQrAt = now;

  processing = true;

  showResult(
    'Перевірка...',
    'loading'
  );

  if (currentMode === 'check') {
    sendCheck(qrValue);
  } else {
    sendIssue(qrValue);
  }
}


// ==============================
// ВИДАЧА
// ==============================

function sendIssue(qrValue) {

  const requestId = createRequestId();

  sendRequest(
    'scan',
    qrValue,
    function(response) {

      if (!handleAuthorization(response)) {
        return;
      }

      if (
        response.status === 'success' &&
        response.planned === false
      ) {

        showResult(
          response.message,
          'unplanned'
        );

        playUnplannedSound();
      }

      else if (
        response.status === 'success'
      ) {

        showResult(
          response.message,
          'success'
        );

        playSuccessSound();
      }

      else if (
        response.status === 'duplicate'
      ) {

        showResult(
          response.message,
          'duplicate'
        );

        playDuplicateSound();
      }

      else {

        showResult(
          response.message ||
          'QR-код недійсний.',
          'error'
        );

        playErrorSound();
      }

      releaseScanner();
    },
    {
      requestId: requestId
    }
  );
}


// ==============================
// ПЕРЕВІРКА QR
// ==============================

function sendCheck(qrValue) {

  sendRequest(
    'check',
    qrValue,
    function(response) {

      if (!handleAuthorization(response)) {
        return;
      }

      if (
        response.status === 'check'
      ) {

        showResult(
          response.message,
          'check'
        );

        playCheckSound();
      }

      else {

        showResult(
          response.message ||
          'QR-код недійсний.',
          'error'
        );

        playErrorSound();
      }

      releaseScanner();
    },
    {
      requestId: createRequestId()
    }
  );
}


// ==============================
// АВТОРИЗАЦІЯ
// ==============================

function handleAuthorization(response) {

  if (!response) {

    showResult(
      'Некоректна відповідь сервера.',
      'error'
    );

    playErrorSound();
    releaseScanner();

    return false;
  }

  if (response.status === 'unauthorized') {

    localStorage.removeItem(
      'zvenScannerPin'
    );

    scannerPin = '';

    showResult(
      'НЕВІРНИЙ PIN',
      'error'
    );

    playErrorSound();

    setTimeout(async function() {

      await stopScanner();

      document.getElementById('mainScreen').style.display =
        'none';

      document.getElementById('pinScreen').style.display =
        'block';

      document.getElementById('pinInput').value =
        '';

      showPinError(
        'Невірний PIN. Введіть PIN ще раз.'
      );

      processing = false;

    }, 1500);

    return false;
  }

  return true;
}


// ==============================
// ЗАПИТ ДО СЕРВЕРА
// ==============================

function sendRequest(
  apiMode,
  qrValue,
  onSuccess,
  options
) {

  options = options || {};

  const requestId =
    options.requestId || createRequestId();

  const callbackName =
    'scanCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );

  const script =
    document.createElement('script');

  let finished = false;
  let slowTimer = null;
  let timeoutTimer = null;


  function failRequest(message) {

    if (finished) return;

    finished = true;

    clearTimeout(slowTimer);
    clearTimeout(timeoutTimer);

    cleanup();

    showResult(
      message,
      'error'
    );

    playErrorSound();
    releaseScanner();
  }


  slowTimer = setTimeout(
    function() {
      if (finished) return;

      showResult(
        'Відповідь затримується.\nОчікуємо завершення...',
        'loading'
      );
    },
    SLOW_RESPONSE_NOTICE_MS
  );


  timeoutTimer = setTimeout(
    function() {
      failRequest(
        'Не вдалося отримати відповідь сервера протягом хвилини.\nСпробуйте ще раз.'
      );
    },
    REQUEST_TIMEOUT_MS
  );


  window[callbackName] =
    function(response) {

      if (finished) return;

      finished = true;

      clearTimeout(slowTimer);
      clearTimeout(timeoutTimer);

      cleanup();

      onSuccess(response);
    };


  script.onerror =
    function() {
      failRequest(
        'Не вдалося з’єднатися із сервером.\nСпробуйте ще раз.'
      );
    };


  function cleanup() {

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] =
        undefined;
    }
  }


  script.src =
    API_URL +
    '?api=' +
    encodeURIComponent(apiMode) +
    '&qr=' +
    encodeURIComponent(qrValue) +
    '&pin=' +
    encodeURIComponent(scannerPin) +
    '&requestId=' +
    encodeURIComponent(requestId) +
    '&callback=' +
    encodeURIComponent(callbackName) +
    '&_=' +
    Date.now();


  document.body.appendChild(script);
}


function createRequestId() {
  return (
    Date.now().toString(36) +
    '_' +
    Math.random().toString(36).slice(2, 10)
  );
}


// ==============================
// НАЗАД
// ==============================

async function goBack() {

  processing = false;
  currentMode = null;

  await stopScanner();

  resetMainScreen();
}


function resetMainScreen() {

  document.getElementById('reader').style.display =
    'none';

  document.getElementById('issueButton').style.display =
    'block';

  document.getElementById('checkButton').style.display =
    'block';

  document.getElementById('logoutButton').style.display =
    'block';

  document.getElementById('backButton').style.display =
    'none';

  document.getElementById('modeTitle').style.display =
    'none';

  document.getElementById('hint').textContent =
    'Оберіть потрібну дію';

  hideResult();
}


// ==============================
// ПАУЗА
// ==============================

function releaseScanner() {

  setTimeout(function() {
    processing = false;
  }, NEXT_SCAN_DELAY_MS);
}


// ==============================
// РЕЗУЛЬТАТ
// ==============================

function showResult(message, type) {

  const result =
    document.getElementById('result');

  result.style.display =
    'block';

  result.className =
    type;

  result.textContent =
    message;
}


function hideResult() {

  const result =
    document.getElementById('result');

  result.className =
    '';

  result.textContent =
    '';

  result.style.display =
    'none';
}


// ==============================
// ЗВУКИ
// ==============================

function playTone(
  frequency,
  duration,
  delay = 0,
  volume = 0.95
) {

  if (!audioContext) {
    return;
  }

  const start =
    audioContext.currentTime + delay;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type =
    'square';

  oscillator.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    0.0001,
    start
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.01
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start(start);

  oscillator.stop(
    start + duration
  );
}


// УСПІШНА ВИДАЧА

function playSuccessSound() {

  playTone(
    1050,
    0.28,
    0,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }
}


// ВИДАНО ПОЗА ПЛАНОМ

function playUnplannedSound() {

  playTone(
    850,
    0.22,
    0,
    0.95
  );

  playTone(
    1150,
    0.30,
    0.28,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      150,
      100,
      200
    ]);
  }
}


// УЖЕ ВИДАНО

function playDuplicateSound() {

  playTone(
    600,
    0.25,
    0,
    0.95
  );

  playTone(
    600,
    0.25,
    0.32,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      150,
      120,
      150
    ]);
  }
}


// ПЕРЕВІРКА QR

function playCheckSound() {

  playTone(
    900,
    0.18,
    0,
    0.85
  );

  if (navigator.vibrate) {
    navigator.vibrate(100);
  }
}


// ПОМИЛКА

function playErrorSound() {

  playTone(
    350,
    0.25,
    0,
    0.95
  );

  playTone(
    260,
    0.25,
    0.30,
    0.95
  );

  playTone(
    180,
    0.35,
    0.60,
    0.95
  );

  if (navigator.vibrate) {
    navigator.vibrate([
      200,
      100,
      200,
      100,
      250
    ]);
  }
}

</script>

</body>
</html>
